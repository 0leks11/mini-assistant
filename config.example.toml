# Copy this to config.toml and fill in your values
# config.toml is gitignored — safe to put non-secret values here
# Secrets (API keys, passwords) go in .env

[assistant]
name = "Мини"
provider = "gemini"                     # "gemini" or "openai"
voice = "Aoede"                          # Gemini voice (Aoede/Charon/Fenrir/Kore/Puck)
# Labels do not train a detector. A private enrolled reference is required.
wake_words = ["штучка", "штучка-интеллект"]
# wakeword_model = "/bkupgrade/data/opt/mini-assistant/keyword.rpw"
languages = ["ru-RU", "en-US"]

[gemini]
model = "models/gemini-3.8-live"
# api_key — set via GEMINI_API_KEY env var, not here

# Used only with assistant.provider = "openai". Set OPENAI_API_KEY locally.
# [openai]
# model = "gpt-realtime"
# voice = "marin"

[audio]
capture_device = "hw:0,2"               # Mini microphone hardware capture (hw:0,2 8ch S32_LE)
capture_backend = "alsa"                # "alsa" (direct hw:0,2 capture via mini_pcm_source) or "vqe" (vendor maind :9850)
playback_device = "default"              # Mini speaker (routes through dmixer/softvol)
sample_rate = 16000
channels = 1

[ha]
url = "http://192.168.1.113:8123"        # Raspberry Pi address
# token — set via HA_TOKEN env var, not here
# allowed_entities = [
#     "climate.midea_xiao_air_conditioner"
# ]

